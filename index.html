        if (!location.hash || location.hash === '#/') document.documentElement.classList.add('ed-boot');

    <style>html.ed-boot, html.ed-boot body { background: #fff; }</style>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'" />

    <link rel="canonical" href="https://www.ernestchoi.com/" />
